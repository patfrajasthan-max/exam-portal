<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Exam Portal</title>
<!-- jsPDF for proper PDF generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.fade-up{animation:fadeUp .4s ease forwards}
#portal{position:fixed;inset:0;z-index:999999;overflow-y:auto;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);font-family:'DM Sans','Segoe UI',sans-serif;}
.glass{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.3);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.gw{background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);border-radius:24px;box-shadow:0 20px 60px rgba(102,126,234,.2);}
.btn{border:none;border-radius:14px;padding:13px 24px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;width:100%;}
.btn:hover{transform:translateY(-2px);}
.btn:disabled{opacity:.5;cursor:default;transform:none!important;}
.bp{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 8px 24px rgba(102,126,234,.4);}
.bs{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 8px 24px rgba(16,185,129,.3);}
.bd{background:linear-gradient(135deg,#f5576c,#ef4444);color:#fff;}
.bo{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.bo:hover{background:rgba(255,255,255,.25);}
.sm{padding:8px 16px;font-size:13px;border-radius:10px;width:auto;}
.inp{width:100%;border:2px solid rgba(102,126,234,.2);border-radius:14px;padding:13px 16px;font-family:inherit;font-size:15px;outline:none;background:#f8f9ff;color:#1a1a2e;transition:all .25s;}
.inp:focus{border-color:#667eea;background:#fff;box-shadow:0 0 0 4px rgba(102,126,234,.12);}
.lbl{color:#64748b;font-size:13px;font-weight:600;margin-bottom:7px;display:block;}
.hdr{background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.2);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.ic{background:rgba(255,255,255,.25);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.icell{background:linear-gradient(135deg,#f8f9ff,#f0f4ff);border:1px solid rgba(102,126,234,.15);border-radius:14px;padding:12px 14px;}
.ilbl{color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.ival{color:#1e293b;font-size:13px;font-weight:600;word-break:break-all;}
.chip{display:inline-block;border-radius:8px;padding:3px 11px;font-size:12px;font-weight:700;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:12px 16px;text-align:left;color:#64748b;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid #f0f4ff;background:#f8f9ff;white-space:nowrap;}
.tbl td{padding:13px 16px;font-size:13px;border-bottom:1px solid #f0f4ff;color:#1e293b;}
.tbl tr:hover td{background:#f8f9ff;}
.ew{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.tb{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;}
.eb{flex:1;display:grid;grid-template-columns:1fr 270px;overflow:hidden;}
.em{overflow-y:auto;padding:20px 24px;background:#f0f4ff;}
.es{background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,.2);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.qcard{background:#fff;border:2px solid #e8edff;border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 4px 16px rgba(102,126,234,.08);}
.ts{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.tl{background:#eff6ff;color:#3b82f6;border:1px solid #bfdbfe;}
.to{background:#fefce8;color:#ca8a04;border:1px solid #fde68a;}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.pb{aspect-ratio:1;border-radius:10px;border:2px solid #e8edff;font-size:12px;font-weight:700;cursor:pointer;background:#f8f9ff;color:#94a3b8;transition:all .2s;}
.pb:hover{transform:scale(1.1);}
.pb.seen{background:linear-gradient(135deg,#c7d2fe,#e0e7ff);color:#4338ca;border-color:#a5b4fc;}
.pb.marked{background:linear-gradient(135deg,#fde68a,#fcd34d);color:#92400e;border-color:#fbbf24;}
.pb.cur{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(102,126,234,.4);}
.prog{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;transition:width .4s;background:linear-gradient(90deg,#4facfe,#00f2fe);}
.vw{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.vw video{width:100%;height:100%;object-fit:cover;}
.vb{position:absolute;inset:0;border:3px solid rgba(79,172,254,.8);border-radius:14px;pointer-events:none;}
.vl{position:absolute;top:8px;left:8px;background:#f5576c;border-radius:6px;padding:2px 8px;color:#fff;font-size:10px;font-weight:700;animation:pulse 2s infinite;}
.nb{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;}
.nf{height:100%;border-radius:4px;transition:width .2s;}
.wp{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#f5576c,#ef4444);border-radius:16px;padding:14px 24px;z-index:10000;display:flex;align-items:center;gap:12px;box-shadow:0 16px 48px rgba(239,68,68,.4);min-width:300px;}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
.pt{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#f0f4ff;border:2px solid #e8edff;}
.pt img{width:100%;height:100%;object-fit:cover;}
.pd{position:absolute;top:4px;right:4px;width:24px;height:24px;background:rgba(239,68,68,.9);border:none;border-radius:50%;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sc{background:rgba(255,255,255,.95);border-radius:16px;padding:18px 20px;box-shadow:0 4px 16px rgba(102,126,234,.12);}
.ldr{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;}
.lr{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top:4px solid #fff;border-radius:50%;animation:spin .8s linear infinite;}
/* ── Admin tabs ── */
.atab{display:flex;gap:8px;margin-bottom:24px;background:rgba(255,255,255,.15);border-radius:16px;padding:6px;}
.atb{flex:1;border:none;border-radius:12px;padding:11px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;background:transparent;color:rgba(255,255,255,.7);}
.atb.active{background:#fff;color:#667eea;box-shadow:0 4px 16px rgba(102,126,234,.25);}
/* ── Question builder ── */
.qrow{background:#fff;border:2px solid #e8edff;border-radius:16px;padding:16px;margin-bottom:12px;position:relative;}
.qrow-num{position:absolute;top:16px;left:16px;width:28px;height:28px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;}
.qrow-del{position:absolute;top:12px;right:12px;background:#fef3f2;border:none;border-radius:8px;padding:4px 10px;color:#ef4444;font-size:12px;font-weight:700;cursor:pointer;}
.qrow-del:hover{background:#fee2e2;}
.sinp{border:2px solid rgba(102,126,234,.2);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;outline:none;background:#f8f9ff;color:#1a1a2e;transition:all .2s;}
.sinp:focus{border-color:#667eea;background:#fff;}
select.sinp{cursor:pointer;}
@media(max-width:768px){.eb{grid-template-columns:1fr}.es{display:none}.dg{grid-template-columns:1fr!important}.ig{grid-template-columns:1fr!important}.stg{grid-template-columns:1fr 1fr!important}.pg{grid-template-columns:repeat(2,1fr)}.atab{flex-direction:column}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:rgba(255,255,255,.1)}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}
</style>
</head>
<body>
<div id="portal"><div id="app"></div></div>
<script>
// ── CONFIG ────────────────────────────────────────────────────
const GAS="https://script.google.com/macros/s/AKfycbzbm9fuWnEjOR9uYfJC4A_8VtVW4rg6MA1e98CAFy6tEq3KGwvf-dZA35qOIted2xTx/exec";
const AU="admin@careereduhub.in", AP="Admin@2025";

// ── STATE ─────────────────────────────────────────────────────
let S={
  scr:"login", student:null, exam:null, questions:[],
  cur:0, seen:new Set(), marked:new Set(),
  tLeft:0, wCnt:0, warnings:[], viols:[],
  pdfDone:false, pdfLink:"", submitting:false, submitted:false,
  eStatus:"loading", eMsg:"", photos:[],
  attendancePhoto:"", attendancePhotoTaken:false,
  allExams:[], // all exams for this student (for timetable view)
  todaysExams:[], // all today's exams with per-exam status
  attData:[], attLoad:true, attQ:"",
  tIv:null, aIv:null, fIv:null, stream:null, camS:null,
  // Admin tabs: attendance | timetable | questions
  adminTab:"attendance",
  examList:[], examListLoad:false,
  // Timetable tab state
  ttCode:"", ttRow:0, ttDate:"", ttStart:"", ttEnd:"",
  ttMsg:"", ttSaving:false, ttLoading:false, ttLoaded:false,
  // Question tab state
  qCode:"", qRow:0, qYear:0, qCourse:"",
  setupQs:[], qMsg:"", qSaving:false, qLoading:false, qLoaded:false,
  // legacy (keep for doLogout)
  setupCode:"", setupRow:0, setupDate:"", setupStart:"", setupEnd:"",
  setupMsg:"", setupSaving:false, setupLoading:false, setupLoaded:false,
};

// ── RENDER ────────────────────────────────────────────────────
function R(){
  const root=document.getElementById("app");
  if(!root)return;
  const m={login:loginH,adminLogin:adminLH,dashboard:dashH,exam:examH,pdfUpload:pdfH,done:doneH,admin:adminH};
  root.innerHTML=(m[S.scr]||loginH)();
  bindEv();
}

// ── UTILS ─────────────────────────────────────────────────────
function pt(s){if(!s)return null;const p=String(s).split(":");const d=new Date();d.setHours(+p[0],+p[1],0,0);return d;}
function fc(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?`${h}:${p2(m)}:${p2(sc)}`:`${p2(m)}:${p2(sc)}`;}
function p2(n){return String(n).padStart(2,"0");}
function ft(d){return d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(n){return Number(n||0).toLocaleString("en-IN");}
function tod(){return new Date().toLocaleDateString("en-CA");}
function dstr(){return new Date().toISOString().slice(0,10).replace(/-/g,"");}
// Live clock string
function nowStr(){const d=new Date();return d.toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
let _clockIv=null;
function startClock(){clearInterval(_clockIv);_clockIv=setInterval(()=>{const el=document.getElementById("live-clock");if(el)el.textContent=nowStr();},1000);}
function clockChip(){return `<span id="live-clock" style="color:rgba(255,255,255,.85);font-size:12px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 10px;white-space:nowrap;">${nowStr()}</span>`;}

// ── API ───────────────────────────────────────────────────────
async function ag(p){
  const r=await fetch(GAS+"?"+new URLSearchParams(p),{redirect:"follow"});
  const txt=await r.text();
  try{return JSON.parse(txt);}catch{return null;}
}
async function ap(b){
  // GAS POST: send as text/plain to avoid CORS preflight issues
  let r;
  try{
    r=await fetch(GAS,{method:"POST",body:JSON.stringify(b),headers:{"Content-Type":"text/plain;charset=utf-8"},redirect:"follow"});
  }catch(netErr){return {success:false,error:"Network error: "+netErr.message};}
  let txt="";
  try{txt=await r.text();}catch{return {success:false,error:"Could not read response"};}
  // If response is empty or just whitespace, treat as success (GAS sometimes returns empty on redirect)
  if(!txt||!txt.trim())return {success:true,_empty:true};
  try{
    const parsed=JSON.parse(txt);
    // If GAS returned an object without explicit success:false, treat as success
    if(parsed&&typeof parsed==="object"&&parsed.success===undefined&&!parsed.error)parsed.success=true;
    return parsed;
  }catch{
    // Non-JSON response — if HTTP 200, treat as success
    if(r.ok)return {success:true,_raw:txt.substring(0,200)};
    return {success:false,error:"Bad response: "+txt.substring(0,100)};
  }
}

// ── LOGIN ─────────────────────────────────────────────────────
function loginH(){return `
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;">
  <div style="position:fixed;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;"></div>
  <div style="position:fixed;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none;"></div>
  <div style="width:100%;max-width:420px;z-index:1;" class="fade-up">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="width:80px;height:80px;margin:0 auto 16px;background:rgba(255,255,255,.2);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:38px;animation:float 3s ease-in-out infinite;box-shadow:0 8px 32px rgba(0,0,0,.15);">🎓</div>
      <div style="color:#fff;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;">Exam Portal</div>
      <div style="color:rgba(255,255,255,.7);font-size:14px;">Smart Online Examination System</div>
    </div>
    <div class="gw" style="padding:36px;">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="color:#1e293b;font-size:22px;font-weight:800;margin-bottom:6px;">Student Login</div>
        <div style="color:#94a3b8;font-size:13px;">अपना Username और Password डालो</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div><span class="lbl">Username / Email</span><input id="eu" class="inp" type="text" placeholder="Enter username"/></div>
        <div><span class="lbl">Password</span>
          <div style="position:relative;"><input id="ep" class="inp" type="password" placeholder="Enter password" style="padding-right:46px;"/>
          <button onclick="toggleP()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#94a3b8;">👁</button></div>
        </div>
        <div id="err" style="display:none;border-radius:14px;padding:16px;font-size:13px;"></div>
        <button class="btn bp" id="lbtn" onclick="doLogin()">🔐 Login to Exam Portal</button>
      </div>
    </div>
    <div style="text-align:center;margin-top:20px;">
      <span onclick="S.scr='adminLogin';R();" style="color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.3);padding:6px 16px;border-radius:8px;">🛡️ Admin Login</span>
    </div>
    <div style="text-align:center;color:rgba(255,255,255,.3);font-size:12px;margin-top:14px;">© 2025 Exam Portal · Secure Examination</div>
  </div>
</div>`;}

function toggleP(){const p=document.getElementById("ep");if(p)p.type=p.type==="password"?"text":"password";}

async function doLogin(){
  const u=document.getElementById("eu")?.value?.trim();
  const p=document.getElementById("ep")?.value?.trim();
  const btn=document.getElementById("lbtn"),err=document.getElementById("err");
  if(!u||!p){sErr(err,"⚠️ Username और Password दोनों डालो।","#fef3f2","#ef4444");return;}
  btn.disabled=true;btn.textContent="Verifying…";
  try{
    const res=await ag({action:"login",username:u,password:p});
    if(res.noExam){sErr(err,"📅 आपका कोई Exam Schedule नहीं है। Admission office से संपर्क करें।","#f0f9ff","#3b82f6");btn.disabled=false;btn.textContent="🔐 Login to Exam Portal";return;}
    if(res.feeError){
      err.style.display="block";err.style.background="linear-gradient(135deg,#fef3f2,#fff5f5)";err.style.border="2px solid #fecaca";
      err.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><div style="font-size:24px;">🚫</div><div><div style="color:#dc2626;font-weight:800;font-size:14px;">Fee Pending — Login Block</div><div style="color:#ef4444;font-size:12px;">Dear ${esc(res.name)}</div></div></div><div style="background:#fff;border-radius:10px;padding:10px;border:1px solid #fecaca;margin-bottom:10px;"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="color:#64748b;font-size:12px;font-weight:600;">Pending:</span><span style="color:#dc2626;font-size:22px;font-weight:900;">₹${fmt(res.unpaid)}</span></div><div style="color:#94a3b8;font-size:11px;margin-top:4px;">Fee जमा करने के बाद login करें।</div></div><a href="https://www.careereduhub.in/p/payment.html" style="display:block;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;text-align:center;padding:9px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;">💳 Fee जमा करो →</a>`;
      btn.disabled=false;btn.textContent="🔐 Login to Exam Portal";return;
    }
    if(res.success){S.student=res.student;S.scr="dashboard";R();loadExam();}
    else{sErr(err,"❌ Invalid Username or Password","#fef3f2","#ef4444");btn.disabled=false;btn.textContent="🔐 Login to Exam Portal";}
  }catch(e){sErr(err,"⚡ Connection error. दोबारा try करो.","#fffbeb","#d97706");btn.disabled=false;btn.textContent="🔐 Login to Exam Portal";}
}
function sErr(el,msg,bg,b){el.style.display="block";el.style.background=bg;el.style.border=`2px solid ${b}`;el.style.color=b;el.style.fontWeight="600";el.textContent=msg;}

// ── ADMIN LOGIN ───────────────────────────────────────────────
function adminLH(){return `
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:400px;" class="fade-up">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:70px;height:70px;margin:0 auto 14px;background:rgba(255,255,255,.2);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;">🛡️</div>
      <div style="color:#fff;font-size:24px;font-weight:800;">Admin Panel</div>
    </div>
    <div class="gw" style="padding:32px;">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div><span class="lbl">Admin Username</span><input id="au" class="inp" type="text" placeholder="Admin username"/></div>
        <div><span class="lbl">Admin Password</span><input id="ap" class="inp" type="password" placeholder="Admin password"/></div>
        <div id="aerr" style="display:none;color:#dc2626;font-size:13px;font-weight:600;background:#fef3f2;border:2px solid #fecaca;border-radius:10px;padding:10px;"></div>
        <button class="btn bp" onclick="doAdminL()">🛡️ Admin Login</button>
        <button class="btn" style="background:rgba(102,126,234,.1);color:#667eea;border:2px solid rgba(102,126,234,.2);" onclick="S.scr='login';R();">← Student Login</button>
      </div>
    </div>
  </div>
</div>`;}

function doAdminL(){
  const u=document.getElementById("au")?.value?.trim(),p=document.getElementById("ap")?.value?.trim();
  const e=document.getElementById("aerr");
  if(!u||!p){e.style.display="block";e.textContent="दोनों fields भरो।";return;}
  if(u===AU&&p===AP){S.scr="admin";S.adminTab="attendance";R();loadAtt();loadExamList();}
  else{e.style.display="block";e.textContent="❌ Invalid Credentials";}
}

// ── LOAD EXAM ─────────────────────────────────────────────────
async function loadExam(){
  try{
    const st=S.student;
    const exams=await ag({action:"getExams",examYear:st.examYear||1,course:st.course||""});
    // Strict frontend filter — sirf same course + same year ke exams
    const myCourse=(st.course||"").trim().toLowerCase();
    const myYear=parseInt(st.examYear||1);
    const filtered=(Array.isArray(exams)?exams:[]).filter(x=>{
      const xCourse=String(x.course||"").trim().toLowerCase();
      const xYear=parseInt(x.year||0);
      // Course match: full string contains check (both ways)
      const courseMatch=xCourse&&myCourse&&(xCourse.includes(myCourse)||myCourse.includes(xCourse));
      // Year match: same year, or exam has no year set (0)
      const yearMatch=xYear===0||xYear===myYear;
      return courseMatch&&yearMatch;
    });
    // Sort by date
    S.allExams=filtered.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const now=new Date(),ts=tod();
    const todayList=filtered.filter(x=>String(x.date).slice(0,10)===ts)
      .sort((a,b)=>String(a.startTime).localeCompare(String(b.startTime)));
    S.todaysExams=todayList.map(e=>{
      const s2=pt(e.startTime),en=pt(e.endTime);
      const early=new Date(s2.getTime()-10*60000);
      let status,msg;
      if(now<early){status="upcoming";msg=`⏰ ${ft(s2)} पर शुरू होगा`;}
      else if(now>=early&&now<s2){status="active";msg=`🟡 ${ft(s2)} पर शुरू — Join करो!`;}
      else if(now>=s2&&now<=en){status="active";msg="✅ LIVE — Start करो!";}
      else{status="closed";msg="🔒 बंद हो गया";}
      return {...e,_status:status,_msg:msg};
    });
    if(!todayList.length){S.eStatus="none";S.eMsg="📅 आज कोई Exam Schedule नहीं है";S.exam=null;}
    else{
      const activeNow=S.todaysExams.find(e=>e._status==="active");
      const firstUpcoming=S.todaysExams.find(e=>e._status==="upcoming");
      S.exam=activeNow||firstUpcoming||S.todaysExams[0];
      const anyActive=S.todaysExams.some(e=>e._status==="active");
      S.eStatus=anyActive?"active":"upcoming";
      S.eMsg=anyActive?"✅ आज के Exams LIVE हैं!":"⏰ आज के Exams Schedule हैं";
    }
  }catch{S.eStatus="error";S.eMsg="Schedule load नहीं हुआ।";}
  R();
}

// Mobile: handle photo from file input
function attHandleFile(inp){
  const file=inp.files&&inp.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const dataUrl=e.target.result;
    // Add watermark via canvas
    const image=new Image();
    image.onload=function(){
      const can=document.createElement("canvas");
      can.width=image.width;can.height=image.height;
      const ctx=can.getContext("2d");
      ctx.drawImage(image,0,0);
      const now=new Date();
      const stamp=`${S.student?.name||""} · ${S.student?.rollNo||""} · ${S.exam?.examCode||""} · ${now.toLocaleString("en-IN")}`;
      ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,can.height-34,can.width,34);
      ctx.fillStyle="#fff";ctx.font=`bold ${Math.max(12,Math.round(can.width*0.022))}px Arial`;
      ctx.fillText(stamp,8,can.height-10);
      const finalUrl=can.toDataURL("image/jpeg",0.88);
      S.attendancePhoto=finalUrl;S.attendancePhotoTaken=true;
      const img=document.getElementById("attPhotoImg");
      const prev=document.getElementById("attPhotoPreview");
      const wrap=document.getElementById("attVidWrap");
      const msg=document.getElementById("attMsg");
      const snapBtn=document.getElementById("attSnapBtn");
      const retakeBtn=document.getElementById("attRetakeBtn");
      const proceedBtn=document.getElementById("attProceedBtn");
      if(img)img.src=finalUrl;
      if(wrap)wrap.style.display="none";
      if(prev)prev.style.display="block";
      if(msg){msg.style.color="#16a34a";msg.textContent="✅ Photo ली गई! Google Drive में save हो रही है…";}
      if(snapBtn)snapBtn.style.display="none";
      if(retakeBtn)retakeBtn.style.display="block";
      if(proceedBtn)proceedBtn.disabled=false;
      attSaveToDrive(finalUrl, now);
    };
    image.src=dataUrl;
  };
  reader.readAsDataURL(file);
  inp.value=""; // reset so same file can be selected again
}
async function attStartCam(){

    catch{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
    _attCamStream=stream;

        fi.click();
      };
    }
  }
}
function attSnap(){
  const vid=document.getElementById("attVid");
  const can=document.getElementById("attCanvas");
  const img=document.getElementById("attPhotoImg");
  const wrap=document.getElementById("attVidWrap");
  const prev=document.getElementById("attPhotoPreview");
  const msg=document.getElementById("attMsg");
  const snapBtn=document.getElementById("attSnapBtn");
  const retakeBtn=document.getElementById("attRetakeBtn");
  const proceedBtn=document.getElementById("attProceedBtn");
  if(!vid||!can)return;
  can.width=vid.videoWidth||640;can.height=vid.videoHeight||480;
  const ctx=can.getContext("2d");
  // Mirror front camera
  ctx.translate(can.width,0);ctx.scale(-1,1);
  ctx.drawImage(vid,0,0,can.width,can.height);
  ctx.setTransform(1,0,0,1,0,0);
  // Watermark strip
  const now=new Date();
  const stamp=`${S.student?.name||""} · ${S.student?.rollNo||""} · ${S.exam?.examCode||""} · ${now.toLocaleString("en-IN")}`;
  ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,can.height-30,can.width,30);
  ctx.fillStyle="#fff";ctx.font="bold 13px Arial";
  ctx.fillText(stamp,8,can.height-9);
  const dataUrl=can.toDataURL("image/jpeg",0.88);
  S.attendancePhoto=dataUrl;S.attendancePhotoTaken=true;
  if(img){img.src=dataUrl;}
  if(wrap)wrap.style.display="none";
  if(prev)prev.style.display="block";
  if(msg){msg.style.color="#16a34a";msg.textContent="✅ Photo ली गई! Retake या Proceed करो।";}
  if(snapBtn)snapBtn.style.display="none";
  if(retakeBtn)retakeBtn.style.display="block";
  if(proceedBtn)proceedBtn.disabled=false;
  // ── Google Drive mein save karo (background) ──────────────────
  attSaveToDrive(dataUrl, now);
}

async function attSaveToDrive(dataUrl, captureTime){
  try{
    const tz=new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata"});
    const dt=captureTime||new Date();
    const dd=String(dt.getDate()).padStart(2,"0");
    const mm=String(dt.getMonth()+1).padStart(2,"0");
    const yyyy=dt.getFullYear();
    const dateStr=`${dd}-${mm}-${yyyy}`;
    const hhmmss=dt.toTimeString().slice(0,8).replace(/:/g,"");
    const name=(S.student?.name||"").replace(/\s+/g,"_");
    const roll=S.student?.rollNo||"";
    const code=S.exam?.examCode||"";
    const fileName=`${roll}_${code}_${name}_${hhmmss}.jpg`;
    const fileData=dataUrl.split(",")[1];
    const msgEl=document.getElementById("attMsg");
    if(msgEl)msgEl.textContent="✅ Photo ली गई! Drive में save हो रही है…";
    const res=await fetch(GAS,{
      method:"POST",
      body:JSON.stringify({
        action:"saveAttendancePhoto",
        fileData, fileName,
        name:S.student?.name||"",
        rollNo:roll,
        examCode:code,
        course:S.student?.course||"",
        date:dateStr
      })
    });
    const r=await res.json();
    S.attendanceDriveLink=r.success?r.driveLink:"";
    if(msgEl){
      if(r.success){msgEl.style.color="#16a34a";msgEl.textContent="✅ Photo ली गई और Google Drive में Save हो गई! 📁";}
      else{msgEl.style.color="#f59e0b";msgEl.textContent="✅ Photo ली गई (Drive save: "+( r.error||"error")+")। Proceed कर सकते हैं।";}
    }
  }catch(e){
    const msgEl=document.getElementById("attMsg");
    if(msgEl){msgEl.style.color="#f59e0b";msgEl.textContent="✅ Photo ली गई (Drive offline)। Proceed करो।";}
  }
}

async function startExam(){
  if(!S.student||!S.exam){alert("Student या Exam data नहीं मिला। Page refresh करो।");return;}
  S.questions=[];S.cur=0;S.seen=new Set();S.marked=new Set();
  S.wCnt=0;S.warnings=[];S.viols=[];S.pdfDone=false;S.submitted=false;S.photos=[];
  S.scr="exam";S.eLoading=true;R();
  try{
    const qs=await ag({action:"getQuestions",examCode:S.exam.examCode,examYear:S.student.examYear||1,course:S.student.course||""});
    S.questions=Array.isArray(qs)?qs.sort((a,b)=>Number(a.qNo)-Number(b.qNo)):[];
    if(!S.questions.length) S.questions=[{examCode:S.exam.examCode,qNo:1,question:"Answer Sheet paper पर लिखो और PDF upload करो।",type:"LONG",marks:S.exam.totalMarks||100}];
    S.seen.add(0);
  }catch(err){
    S.questions=[{examCode:S.exam.examCode,qNo:1,question:"Paper पर answers लिखो और PDF upload करो।",type:"LONG",marks:S.exam.totalMarks||100}];
    S.seen.add(0);
  }
  S.eLoading=false;
  try{
    const now=new Date();
    const dd=String(now.getDate()).padStart(2,"0");
    const mm=String(now.getMonth()+1).padStart(2,"0");
    const yyyy=now.getFullYear();
    const examDate=`${dd}-${mm}-${yyyy}`;
    await ap({action:"logAttendance",name:S.student.name,rollNo:String(S.student.rollNo),examCode:S.exam.examCode,course:S.student.course||"",startTime:now.toTimeString().slice(0,8),status:"In Exam",examDate:examDate});
  }catch{}
  R();
  try{startTimer();}catch{}
  try{await startCamera();}catch{}
  try{startAntiCheat();}catch{}
  try{document.documentElement.requestFullscreen?.();}catch{}
}

function startTimer(){
  clearInterval(S.tIv);
  const end=pt(S.exam.endTime);
  const tick=()=>{
    const diff=Math.max(0,Math.floor((end-new Date())/1000));
    S.tLeft=diff;
    const el=document.getElementById("tmr");
    if(el){el.textContent=fc(diff);const r=diff<=300&&diff>0,o=diff<=1800&&diff>300;el.style.color=r?"#ef4444":o?"#f59e0b":"#fff";}
    if(diff<=0&&!S.submitted)goToPDF();
  };
  tick();S.tIv=setInterval(tick,1000);
}

// ── CAMERA ────────────────────────────────────────────────────
async function startCamera(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    S.stream=s;S.fStatus="✅ Active";
    setTimeout(()=>{const v=document.getElementById("vdo");if(v)v.srcObject=s;},200);
    try{setupAudio(s);}catch{}
    try{fakeFace();}catch{}
  }catch(e){
    console.warn("Camera denied:",e);
    S.fStatus="❌ Denied";
    try{addViol("Camera denied");}catch{}
  }
}
function fakeFace(){
  let nf=0;
  S.fIv=setInterval(()=>{
    if(S.scr!=="exam"){clearInterval(S.fIv);return;}
    const r=Math.random();
    if(r<0.87){S.fStatus="✅ Face Detected";nf=0;}
    else if(r<0.95){S.fStatus="⚠️ No Face";nf++;if(nf>=2)trigW("No face detected!");}
    else{S.fStatus="⚠️ Multiple Faces";trigW("Multiple faces detected!");}
    const el=document.getElementById("fsts");
    if(el){el.textContent=S.fStatus;el.style.color=S.fStatus.includes("✅")?"#4facfe":"#f7971e";}
  },4500);
}
function setupAudio(s){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const an=ctx.createAnalyser();an.fftSize=256;
    ctx.createMediaStreamSource(s).connect(an);
    const d=new Uint8Array(an.frequencyBinCount);
    function m(){
      if(S.scr!=="exam")return;
      an.getByteFrequencyData(d);
      const avg=d.reduce((a,b)=>a+b,0)/d.length;
      S.noiseLevel=Math.min(100,avg*2);
      const nf=document.getElementById("nf"),nt=document.getElementById("ntxt");
      if(nf){nf.style.width=S.noiseLevel+"%";nf.style.background=S.noiseLevel>60?"linear-gradient(90deg,#f5576c,#f093fb)":S.noiseLevel>30?"linear-gradient(90deg,#f7971e,#ffd200)":"linear-gradient(90deg,#4facfe,#00f2fe)";}
      if(nt){nt.textContent=S.noiseLevel>60?"High":S.noiseLevel>30?"Med":"Low";nt.style.color=S.noiseLevel>60?"#f5576c":S.noiseLevel>30?"#f7971e":"#4facfe";}
      requestAnimationFrame(m);
    }
    m();
  }catch{}
}

function startAntiCheat(){document.addEventListener("visibilitychange",onVis);document.addEventListener("contextmenu",noD);document.addEventListener("copy",noD);document.addEventListener("paste",noD);document.addEventListener("keydown",noK);}

function onVis(){if(document.hidden&&S.scr==="exam"){trigW("Tab switch detected!");addViol("Tab switch");}}
function noD(e){if(S.scr==="exam")e.preventDefault();}
function noK(e){if(S.scr==="exam"&&(e.ctrlKey||e.metaKey)&&"cvxa".includes(e.key.toLowerCase()))e.preventDefault();}
function trigW(msg){
  S.wCnt++;S.warnings.push({msg,time:new Date().toLocaleTimeString()});

  if(wb){wb.textContent=`⚠️ ${S.wCnt} Violations`;wb.style.animation="blink 2s infinite";}

}

// ── AUTO-CAPTURE & AUTO-CROP STATE ───────────────────────────
let _acTimer=null, _acSecs=0, _autoCropOn=false;

function toggleAutoCap(){
  if(_acTimer){clearAutoCap();return;}
  _acSecs=3;
  const btn=document.getElementById("acBtn");
  if(btn){btn.textContent="⏹ Stop";btn.style.background="rgba(239,68,68,.9)";}
  const ring=document.getElementById("acRing");if(ring)ring.style.display="block";
  runAcTick();
}
function runAcTick(){
  const arc=document.getElementById("acArc"),num=document.getElementById("acNum");
  const total=3,circ=213.6;
  if(arc)arc.style.strokeDashoffset=circ*(1-(_acSecs/total));
  if(num)num.textContent=_acSecs;
  if(_acSecs<=0){capPhoto();clearAutoCap();return;}
  _acSecs--;
  _acTimer=setTimeout(runAcTick,1000);
}
function clearAutoCap(){
  clearTimeout(_acTimer);_acTimer=null;_acSecs=0;
  const btn=document.getElementById("acBtn");
  if(btn){btn.textContent="⏱ Auto";btn.style.background="rgba(79,172,254,.9)";}
  const ring=document.getElementById("acRing");if(ring)ring.style.display="none";
}
function toggleAutoCrop(){
  _autoCropOn=!_autoCropOn;
  const btn=document.getElementById("cropBtn");
  if(btn){btn.style.background=_autoCropOn?"rgba(245,158,11,.9)":"rgba(16,185,129,.85)";btn.textContent=_autoCropOn?"✂️ Crop ON":"✂️ Crop";}
  const ov=document.getElementById("cropOverlay");
  if(!_autoCropOn&&ov){const ctx=ov.getContext("2d");ctx.clearRect(0,0,ov.width,ov.height);}
}

// Draw crop-guide overlay on camera frame
function drawCropGuide(){
  const vid=document.getElementById("camprev");
  const ov=document.getElementById("cropOverlay");
  if(!vid||!ov||!_autoCropOn)return;
  ov.width=vid.videoWidth||vid.offsetWidth||400;
  ov.height=vid.videoHeight||vid.offsetHeight||300;
  const ctx=ov.getContext("2d");ctx.clearRect(0,0,ov.width,ov.height);
  const W=ov.width,H=ov.height;
  // A4-ish guide rectangle (80% width, centred)
  const gw=W*.78,gh=gw*1.414,gx=(W-gw)/2,gy=(H-gh)/2>0?(H-gh)/2:4;
  ctx.strokeStyle="#4facfe";ctx.lineWidth=3;ctx.setLineDash([12,6]);
  ctx.strokeRect(gx,gy,gw,Math.min(gh,H-gy-4));
  // Corner marks
  const cs=20;ctx.setLineDash([]);ctx.strokeStyle="#00f2fe";ctx.lineWidth=4;
  [[gx,gy],[gx+gw,gy],[gx,gy+Math.min(gh,H-gy-4)],[gx+gw,gy+Math.min(gh,H-gy-4)]].forEach(([cx,cy],idx)=>{
    const sx=idx%2===0?1:-1,sy=idx<2?1:-1;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+sx*cs,cy);ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+sy*cs);ctx.stroke();
  });
}
let _cropGuideIv=null;
function startCropGuide(){clearInterval(_cropGuideIv);_cropGuideIv=setInterval(()=>{if(_autoCropOn)drawCropGuide();},200);}

// Auto-crop: crop to guide rectangle before saving
function cropImageToGuide(vid){
  const c=document.createElement("canvas");
  const vw=vid.videoWidth||1280,vh=vid.videoHeight||720;
  c.width=vw;c.height=vh;
  const ctx=c.getContext("2d");ctx.drawImage(vid,0,0,vw,vh);
  // Compute guide rect same as drawCropGuide
  const gw=vw*.78,gh=gw*1.414,gx=(vw-gw)/2,gy=(vh-gh)/2>0?(vh-gh)/2:4;
  const ch=Math.min(gh,vh-gy-4);
  // Crop canvas
  const c2=document.createElement("canvas");c2.width=Math.round(gw);c2.height=Math.round(ch);
  const ctx2=c2.getContext("2d");ctx2.drawImage(c,gx,gy,gw,ch,0,0,gw,ch);
  return c2;
}

function capPhoto(){
  const vid=document.getElementById("camprev");if(!vid)return;
  let canvas;
  if(_autoCropOn){
    canvas=cropImageToGuide(vid);
  }else{
    canvas=document.createElement("canvas");
    canvas.width=vid.videoWidth||1280;canvas.height=vid.videoHeight||720;
    canvas.getContext("2d").drawImage(vid,0,0,canvas.width,canvas.height);
  }
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="rgba(102,126,234,0.5)";ctx.font=`bold ${Math.max(14,canvas.width*.018)}px Arial`;
  ctx.fillText(`${S.student?.rollNo||""} · ${S.student?.name||""} · ${S.exam?.examCode||""} · ${new Date().toLocaleDateString()}`,8,canvas.height-10);
  S.photos.push(canvas.toDataURL("image/jpeg",.88));
  const fl=document.createElement("div");fl.style.cssText="position:fixed;inset:0;background:#fff;z-index:9999;opacity:.8;pointer-events:none;";
  document.body.appendChild(fl);setTimeout(()=>fl.remove(),150);
  // Auto-schedule next if auto-capture was running
  clearAutoCap();
  R();
  setTimeout(()=>{openCam();if(_autoCropOn)toggleAutoCrop();if(_autoCropOn||true){}},250);
}
function delPh(i){S.photos.splice(i,1);R();}
function handleFiles(inp){
  Array.from(inp.files||[]).forEach(f=>{
    if(f.type.startsWith("image/")){const r=new FileReader();r.onload=e=>{S.photos.push(e.target.result);R();};r.readAsDataURL(f);}

// ── CREATE PDF ────────────────────────────────────────────────
async function createPDF(){
  closeCamera();
  if(S.photos.length===0){alert("कोई photo नहीं है! पहले Camera से photos लो।");return;}
  const prog=document.getElementById("pdfprog"),bar=document.getElementById("pdfbar"),st=document.getElementById("pdfst");
  if(prog)prog.style.display="block";
  const pn=`${S.student?.rollNo||"ROLL"}_${(S.student?.name||"NAME").replace(/\s+/g,"_")}_${S.exam?.examCode||"EXAM"}_${dstr()}.pdf`;

  try{
    // ── Step 1: Process photos ──────────────────────────────────
    if(st)st.textContent="Photos process हो रहे हैं…";if(bar)bar.style.width="10%";
    const pages=[];
    for(let i=0;i<S.photos.length;i++){
      const img=await loadImg(S.photos[i]);
      const c=document.createElement("canvas");
      // A4 ratio at reasonable resolution
      c.width=1240;c.height=1754;
      const ctx=c.getContext("2d");
      ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
      const sc=Math.min(c.width/img.width,(c.height-40)/img.height);
      const w=img.width*sc,h=img.height*sc,x=(c.width-w)/2,y=10;
      ctx.drawImage(img,x,y,w,h);
      // Watermark footer
      ctx.fillStyle="rgba(102,126,234,0.55)";
      ctx.fillRect(0,c.height-36,c.width,36);
      ctx.fillStyle="#fff";ctx.font="bold 15px Arial";
      ctx.fillText(`${S.student?.rollNo||""} · ${S.student?.name||""} · ${S.exam?.examCode||""} · Page ${i+1}/${S.photos.length}`,10,c.height-12);
      // Use 0.75 quality to keep file size manageable for GAS (< 5MB limit)
      pages.push(c.toDataURL("image/jpeg",0.75).split(",")[1]);
      if(bar)bar.style.width=`${10+((i+1)/S.photos.length)*35}%`;
      if(st)st.textContent=`Page ${i+1}/${S.photos.length} ready…`;
    }

    // ── Step 2: Build PDF ───────────────────────────────────────
    if(st)st.textContent="PDF बन रही है…";if(bar)bar.style.width="50%";
    const pdfB64=await buildPDF(pages);

    // Size check — GAS has ~6MB POST limit
    const sizeKB=Math.round(pdfB64.length*0.75/1024);
    if(st)st.textContent=`PDF ready (${sizeKB} KB) — Drive में upload हो रहा है…`;
    if(bar)bar.style.width="65%";

    // ── Step 3: Upload to GAS — with 1 retry ───────────────────
    let res=null;
    let attempt=0;
    while(attempt<2){
      attempt++;
      try{
        res=await ap({
          action:"uploadPDF",
          fileName:pn,
          fileData:pdfB64,
          mimeType:"application/pdf",
          examCode:S.exam?.examCode||"",
          studentName:S.student?.name||"",
          rollNo:String(S.student?.rollNo||""),
          course:S.student?.course||""
        });
        if(res&&res.success)break; // success — stop retrying
        if(attempt<2){
          if(st)st.textContent=`Retry ${attempt}…`;
          await new Promise(r=>setTimeout(r,2000));
        }
      }catch(uploadErr){
        console.warn(`Upload attempt ${attempt} threw:`,uploadErr);
        if(attempt<2)await new Promise(r=>setTimeout(r,2000));
      }
    }

    if(bar)bar.style.width="100%";

    // ── Step 4: Result handling ─────────────────────────────────
    const isDriveAccessErr=res&&typeof res.error==="string"&&res.error.includes("Access denied: DriveApp");
    const isSuccess=res&&res.success;
    const isSoftErr=isDriveAccessErr; // file likely saved even on this error

    if(isSuccess){
      if(st){st.textContent="✅ PDF Google Drive में Upload हो गई!";st.style.color="#16a34a";}
      S.pdfDone=true;
      S.pdfLink=res.driveLink||"";
      // Show drive link immediately
      if(res.driveLink){
        const linkEl=document.createElement("a");
        linkEl.href=res.driveLink;linkEl.target="_blank";
        linkEl.textContent="📎 Drive में देखो";
        linkEl.style.cssText="display:block;margin-top:8px;color:#667eea;font-size:13px;font-weight:600;";
        if(st)st.parentElement?.appendChild(linkEl);
      }
    }else if(isSoftErr){
      if(st){st.textContent="⚠️ PDF save हुई (Drive permission warning — Drive check करो)";st.style.color="#f59e0b";}
      console.warn("DriveApp soft error — file may have saved:",res);
      S.pdfDone=true;S.pdfLink="";
    }else{
      // Real failure
      const errMsg=res?.error||res?.msg||(res?JSON.stringify(res):"No response from server");
      if(st){st.textContent="❌ Upload failed: "+errMsg;st.style.color="#ef4444";}
      console.error("createPDF upload error:",res);
      S.pdfDone=false;
      // Show retry button
      const retryBtn=document.createElement("button");
      retryBtn.textContent="🔄 फिर से try करो";
      retryBtn.style.cssText="margin-top:10px;background:#667eea;border:none;border-radius:10px;padding:10px 20px;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;";
      retryBtn.onclick=createPDF;
      if(prog)prog.appendChild(retryBtn);
    }
    setTimeout(()=>R(),1200);

  }catch(e){
    console.error("createPDF exception:",e);
    if(bar)bar.style.width="100%";
    if(st){st.textContent="❌ Error: "+e.message;st.style.color="#ef4444";}
    S.pdfDone=false;
    setTimeout(()=>R(),2000);
  }
}

// ── BUILD PDF using jsPDF — proper JPEG embedding ──
async function buildPDF(jpegs){
  return new Promise((resolve,reject)=>{
    try{
      // jsPDF: A4 portrait, mm units
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
      const W=210,H=297; // A4 mm
      jpegs.forEach((b64,i)=>{
        if(i>0)doc.addPage();
        doc.addImage("data:image/jpeg;base64,"+b64,"JPEG",0,0,W,H,undefined,"FAST");
      });
      // Return base64 string (without data URI prefix)
      const b64pdf=doc.output("datauristring").split(",")[1];
      resolve(b64pdf);
    }catch(e){reject(e);}
  });
}

function ttLoad(code){

  // Use data already fetched in examList — no extra API call needed
  const ex=S.examList.find(x=>x.examCode===code);
  if(!ex){S.ttMsg="❌ Exam not found in list";R();return;}
  S.ttCode=code;

  qEls.forEach(el=>{

    const type=el.querySelector(".q-type")?.value||"LONG";

  S.setupQs=qs;S.qSaving=true;S.qMsg="";R();
  try{

    console.log("Saving questions:",{examCode:S.qCode,rowIndex:S.qRow,count:qs.length,questions:qs});
    const res=await ap({
      action:"saveQuestions",
      examCode:S.qCode,

      course:S.qCourse,
      questions:qs.map(q=>({text:String(q.text||"").trim(),type:q.type||"LONG",marks:Number(q.marks)||5}))

    console.log("saveQuestions response:",JSON.stringify(res));

    }
  }catch(e){S.qMsg="⚡ Error: "+e.message;console.error("qSave error",e);}
  S.qSaving=false;R();
}

      </div>
    </div>`:""}

    <!-- ══ TAB 2: TIMETABLE SETUP ══ -->
    ${S.adminTab==="timetable"?`
    <div class="gw" style="padding:28px;margin-bottom:20px;">
      <div style="color:#1e293b;font-size:18px;font-weight:800;margin-bottom:4px;">📅 Timetable Setup</div>
      <div style="color:#94a3b8;font-size:13px;margin-bottom:20px;">Exam चुनो → Date और Time set करो → Save करो</div>

      <div style="margin-bottom:20px;">
        <span class="lbl">Exam Select करो</span>
        <select class="inp sinp" onchange="ttLoad(this.value)" style="cursor:pointer;">
          <option value="">-- Exam चुनो --</option>
          ${S.examList.map(e=>`<option value="${esc(e.examCode)}" ${S.ttCode===e.examCode?"selected":""}>${esc(e.examCode)} — ${esc(e.subject)} (Year ${esc(String(e.year||""))}, ${esc(e.course)})</option>`).join("")}
        </select>
      </div>

      ${S.ttLoading?`<div style="text-align:center;padding:30px;"><div class="lr" style="margin:0 auto 12px;"></div><div style="color:#94a3b8;">Loading…</div></div>`:""}
      ${S.ttMsg?`<div style="margin-bottom:16px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;background:${S.ttMsg.startsWith("✅")?"#f0fdf4":S.ttMsg.startsWith("⚠️")?"#fffbeb":S.ttMsg.startsWith("ℹ️")?"#eff6ff":"#fef3f2"};color:${S.ttMsg.startsWith("✅")?"#16a34a":S.ttMsg.startsWith("⚠️")?"#92400e":S.ttMsg.startsWith("ℹ️")?"#1d4ed8":"#dc2626"};border:2px solid ${S.ttMsg.startsWith("✅")?"#bbf7d0":S.ttMsg.startsWith("⚠️")?"#fde68a":S.ttMsg.startsWith("ℹ️")?"#bfdbfe":"#fecaca"};">${esc(S.ttMsg)}</div>`:""}

      ${S.ttLoaded?`
      <div style="background:linear-gradient(135deg,#f0f4ff,#e8edff);border:2px solid rgba(102,126,234,.2);border-radius:14px;padding:14px 18px;margin-bottom:24px;display:flex;align-items:center;gap:12px;">
        <div style="font-size:24px;">📅</div>
        <div><div style="color:#1e293b;font-size:15px;font-weight:800;">${esc(S.ttCode)}</div><div style="color:#64748b;font-size:12px;">Row ${S.ttRow}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:24px;" class="stg">
        <div><span class="lbl">📅 Exam Date</span><input id="ttDate" class="inp" type="date" value="${esc(S.ttDate)}"/></div>
        <div><span class="lbl">⏰ Start Time</span><input id="ttStart" class="inp" type="time" value="${esc(S.ttStart)}"/></div>
        <div><span class="lbl">🏁 End Time</span><input id="ttEnd" class="inp" type="time" value="${esc(S.ttEnd)}"/></div>
      </div>
      <button onclick="ttSave()" class="btn bs" style="max-width:220px;" ${S.ttSaving?"disabled":""}>
        ${S.ttSaving?`<span style="display:flex;align-items:center;justify-content:center;gap:8px;"><span style="width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;"></span>Saving…</span>`:"💾 Timetable Save करो"}
      </button>
      `:""}
    </div>`:""}

    <!-- ══ TAB 3: QUESTION SETUP ══ -->
    ${S.adminTab==="questions"?`
    <div class="gw" style="padding:28px;margin-bottom:20px;">
      <div style="color:#1e293b;font-size:18px;font-weight:800;margin-bottom:4px;">❓ Question Setup</div>
      <div style="color:#94a3b8;font-size:13px;margin-bottom:20px;">Exam चुनो → Questions add करो → Save करो</div>

      <div style="margin-bottom:20px;">
        <span class="lbl">Exam Select करो</span>
        <select class="inp sinp" onchange="qLoad(this.value)" style="cursor:pointer;">
          <option value="">-- Exam चुनो --</option>
          ${S.examList.map(e=>`<option value="${esc(e.examCode)}" ${S.qCode===e.examCode?"selected":""}>${esc(e.examCode)} — ${esc(e.subject)} (Year ${esc(String(e.year||""))}, ${esc(e.course)})</option>`).join("")}
        </select>
      </div>

      ${S.qLoading?`<div style="text-align:center;padding:30px;"><div class="lr" style="margin:0 auto 12px;"></div><div style="color:#94a3b8;">Loading…</div></div>`:""}
      ${(S.qMsg&&(!S.qLoaded||S.qMsg.startsWith("✅")||S.qMsg.startsWith("⚠️")))?`<div style="margin-bottom:16px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;background:${S.qMsg.startsWith("✅")?"#f0fdf4":S.qMsg.startsWith("⚠️")?"#fffbeb":"#fef3f2"};color:${S.qMsg.startsWith("✅")?"#16a34a":S.qMsg.startsWith("⚠️")?"#92400e":"#dc2626"};border:2px solid ${S.qMsg.startsWith("✅")?"#bbf7d0":S.qMsg.startsWith("⚠️")?"#fde68a":"#fecaca"};">${esc(S.qMsg)}</div>`:""}

      ${S.qLoaded?`
      <div style="background:linear-gradient(135deg,#f0f4ff,#e8edff);border:2px solid rgba(102,126,234,.2);border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="font-size:24px;">❓</div>
          <div><div style="color:#1e293b;font-size:15px;font-weight:800;">${esc(S.qCode)}</div><div style="color:#64748b;font-size:12px;">Questions: ${S.setupQs.length}</div></div>
        </div>
        <button onclick="qAddQ()" style="background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:10px;padding:9px 18px;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">+ Add Question</button>
      </div>

      <div id="qlist">
        ${S.setupQs.length===0?`<div style="text-align:center;padding:32px;background:#f8f9ff;border:2px dashed #e8edff;border-radius:16px;color:#94a3b8;font-size:14px;">कोई question नहीं है।<br/>ऊपर "+ Add Question" click करो।</div>`:""}
        ${S.setupQs.map((q,i)=>`
        <div class="qrow q-row" data-id="${q.id}">
          <div class="qrow-num">${i+1}</div>
          <button class="qrow-del" onclick="qDelQ(${q.id})">✕ Delete</button>
          <div style="padding-left:42px;">
            <div style="display:grid;grid-template-columns:160px 100px 1fr;gap:10px;align-items:end;margin-bottom:10px;" class="stg">
              <div>
                <span class="lbl" style="font-size:11px;">Type</span>
                <select class="sinp q-type" style="width:100%;padding:8px 10px;">
                  <option value="LONG" ${q.type==="LONG"?"selected":""}>📝 Long Answer</option>
                  <option value="SHORT" ${q.type==="SHORT"?"selected":""}>✏️ Short Answer</option>
                  <option value="ONE" ${q.type==="ONE"?"selected":""}>〰️ One Line</option>
                </select>
              </div>
              <div>
                <span class="lbl" style="font-size:11px;">Marks</span>
                <input class="sinp q-marks" type="number" min="1" max="100" value="${q.marks||5}" style="width:100%;padding:8px 10px;"/>
              </div>
              <div>
                <span class="lbl" style="font-size:11px;">Question Text</span>
                <input class="sinp q-text-inp" type="text" value="${esc(q.text)}" placeholder="Question यहाँ लिखो…" style="width:100%;padding:8px 10px;"/>
              </div>
            </div>
          </div>
        </div>`).join("")}
      </div>

      <div style="margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <button onclick="qSave()" class="btn bs" style="max-width:220px;" ${S.qSaving?"disabled":""}>
          ${S.qSaving?`<span style="display:flex;align-items:center;justify-content:center;gap:8px;"><span style="width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;"></span>Saving…</span>`:"💾 Questions Save करो"}
        </button>
        <button onclick="qAddQ()" style="background:rgba(102,126,234,.1);border:2px solid rgba(102,126,234,.2);border-radius:12px;padding:11px 20px;color:#667eea;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">+ Add More</button>
      </div>
      `:""}
    </div>`:""}

  </div>
</div>`;
}
// ── BIND & INIT ───────────────────────────────────────────────
function bindEv(){
  ["eu","ep"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});});
  ["au","ap"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("keydown",e=>{if(e.key==="Enter")doAdminL();});});
  if(S.scr==="exam"&&S.stream)setTimeout(()=>{const v=document.getElementById("vdo");if(v)v.srcObject=S.stream;},60);
  // Start clock after each render (restarts ticker with fresh element reference)
  if(["dashboard","admin","pdfUpload","exam"].includes(S.scr))startClock();
}
// Auto-refresh removed — use manual refresh button
R();
</script>
</body>
</html>
